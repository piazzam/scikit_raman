[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "scikit-raman"
version = "0.1.0"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
  'matplotlib==3.8.3',
  'numpy==1.23.5',
  'optuna==3.6.1',
  'pandas==1.4.4',
  'PeakUtils==1.3.4',
  'plotly==5.20.0',
  'scikit_learn==1.4.1.post1',
  'scipy==1.9.1',
  'seaborn==0.13.2',
  'tqdm==4.66.2',
  'wandb==0.16.5'
]

[project.optional-dependencies]
standardKeras = [
  'tensorflow==2.16.1'
]
mindHardKeras = [
  'tensorflow[and-cuda]'
]
torch = [
  'torch==2.0.1'
]
dev = [
  'pytest>=7',
  'ruff>=0.5',
]

[project.scripts]
scikit-raman-cli = "scikit_raman.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py39"
extend-exclude = ["docs", "docs-env"]

[tool.ruff.lint]
select = ["E", "F", "W"]
# The existing sources predate any linting and Stage 3 handles the real cleanup.
# Grandfather the current stylistic violation classes here so CI still catches
# new problems (syntax errors, undefined names, unused imports in new code).
ignore = [
  "E501",  # line too long
  "E711", "E712",  # == None / == True comparisons
  "E721",  # type() comparison
  "E722",  # bare except
  "E731",  # lambda assignment
  "E741",  # ambiguous variable name
  "W191", "W291", "W293", "W292", "W605", "E101",  # whitespace / tabs / escapes
]

[tool.ruff.lint.per-file-ignores]
"src/scikit_raman/**" = ["F401", "F403", "F405", "F811", "F841"]
